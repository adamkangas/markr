services:
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      NODE_ENV: development
      PORT: "4567"
      DATABASE_PATH: /data/markr.db
    ports:
      - "4567:4567"
    volumes:
      - api-data:/data

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        VITE_API_BROWSER_BASE_URL: http://localhost:4567
        VITE_API_SERVER_BASE_URL: http://api:4567
    environment:
      NODE_ENV: development
      VITE_API_BROWSER_BASE_URL: http://localhost:4567
      VITE_API_SERVER_BASE_URL: http://api:4567
    ports:
      - "3000:3000"
    depends_on:
      - api

volumes:
  api-data:
